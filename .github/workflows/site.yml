name: Сайт на GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'editors/vscode/**'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      # Сайт імпортує src/ кореня, тож потрібні й залежності кореня (magic-string тощо).
      - run: npm ci
        working-directory: .

      - run: npm ci
        working-directory: site

      - run: npm run lint
        working-directory: site

      - run: npm run typecheck
        working-directory: site

      - run: npm run build
        working-directory: site
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
